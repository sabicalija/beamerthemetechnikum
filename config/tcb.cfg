% tcolorbox Configuration for Technikum Theme
% Styles and configurations for tcolorbox environments
\tcbuselibrary{skins}

% =============================================================================
% TCOLORBOX GLOBAL SETTINGS
% =============================================================================
\tcbset{
    % Global styling for all tcolorboxes
    boxrule=1pt,
    arc=0pt,
    outer arc=0pt,
    left=0pt,
    right=0pt,
    top=0pt,
    bottom=0pt,
    middle=1em,
    fonttitle=\usebeamerfont{block title}\vphantom{Äg},
}

% =============================================================================
% TCOLORBOX CUSTOM STYLES
% =============================================================================
\tcbset{
    eq/.style={
            colframe=fhtw-green!90!black,
            colback=white,
            boxrule=1pt,
            arc=0.1em,
            outer arc=0.1em,
            left=0.5ex,
            right=0.5ex,
            top=0.5ex,
            bottom=0.5ex,
            boxsep=0pt,
            after skip=0pt,
            before skip=0pt,
        },
    split/.style 2 args={
            code={\def\tcbhaslefttitle{0}\def\tcbhasrighttitle{0}},
            fonttitle=\usebeamerfont{block title}\vphantom{Äg},
            enhanced,
            sidebyside,
            frame hidden,
            interior hidden,
            boxsep=0pt,
            left=0pt, right=0pt, top=0pt, bottom=0pt,
            boxsep=0pt,
            lefthand ratio=#1,
            segmentation style={draw=#2},
        },
    split/.default={0.5}{black},
    left title/.style={
            code={%
                    \def\tcbhaslefttitle{1}%
                    \ifcsname tcbhasrighttitle\endcsname
                        \ifnum\tcbhasrighttitle=1 \tcbset{sidebyside align=top}\fi
                    \fi
                },
            before upper={{\usebeamerfont{block title}#1}\par\vspace{0.75ex}},
        },
    right title/.style={
            code={%
                    \def\tcbhasrighttitle{1}%
                    \ifcsname tcbhaslefttitle\endcsname
                        \ifnum\tcbhaslefttitle=1 \tcbset{sidebyside align=top}\fi
                    \fi
                },
            before lower={{\usebeamerfont{block title}#1}\par\vspace{0.75ex}},
        },
}