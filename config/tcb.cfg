% tcolorbox Configuration for Technikum Theme
% Styles and configurations for tcolorbox environments

% =============================================================================
% TCOLORBOX GLOBAL SETTINGS
% =============================================================================
\tcbset{
    % Global styling for all tcolorboxes
    boxrule=1pt,
    arc=0pt,
    outer arc=0pt,
    left=0pt,
    right=0pt,
    top=0pt,
    bottom=0pt,
    middle=1em,
}

% =============================================================================
% TCOLORBOX CUSTOM STYLES
% =============================================================================
\tcbset{
    eq/.style={
            colframe=fhtw-green!90!black,
            colback=white,
            boxrule=1pt,
            arc=0.1em,
            outer arc=0.1em,
            left=0.5ex,
            right=0.5ex,
            top=0.5ex,
            bottom=0.5ex,
            boxsep=0pt,
            after skip=0pt,
            before skip=0pt,
        }
}