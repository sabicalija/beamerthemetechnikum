\RequirePackage{eqparbox}
\newcounter{legendid}

% =============================================================================
% CUSTOM COMMANDS & ENVIRONMENTS
% =============================================================================

% Syntax: \lentry[<optional fixed width>]{<label>}{<text>}
\NewDocumentCommand{\lentry}{ o m m }{%
    \IfNoValueTF{#1}{%
        % 1. Make the box exactly as wide as the widest label (no padding inside)
        \eqmakebox[legend\thelegendid][l]{#2}%
        % 2. Add the padding rigidly AFTER the box
        \hspace{0.5em}% 
    }{%
        \makebox[#1][l]{#2}%
    }%
    #3%
}

\newenvironment{variables}{
    \stepcounter{legendid}
    \begin{itemize}
        }{
    \end{itemize}
}

% ---- Math Braces Workaround (XeLaTeX/Beamer/Noto Font Fix) ----

% Syntax: \tikzunderbrace{<math term>}{<label>}
\NewDocumentCommand{\tikzunderbrace}{ m m }{%
    \tikz[baseline=(term.base)]{
        \node[inner sep=0pt, outer sep=0pt] (term) {$\displaystyle #1$};
        \draw[decorate, decoration={calligraphic brace, amplitude=4pt, mirror}, thick]
        ([yshift=-2pt]term.south west) --
        node[below=0.8ex] {$\displaystyle #2$}
        ([yshift=-2pt]term.south east);
    }%
}

% Syntax: \tikzoverbrace{<math term>}{<label>}
\NewDocumentCommand{\tikzoverbrace}{ m m }{%
    \tikz[baseline=(term.base)]{
        \node[inner sep=0pt, outer sep=0pt] (term) {$\displaystyle #1$};
        \draw[decorate, decoration={calligraphic brace, amplitude=4pt}, thick]
        ([yshift=2pt]term.north west) --
        node[above=0.8ex] {$\displaystyle #2$}
        ([yshift=2pt]term.north east);
    }%
}

% =============================================================================
% DIAGRAM STYLES
% =============================================================================

% Diagram-specific styles
\tikzset{
    % Add custom diagram styles here as needed
    legend/.style={
            execute at begin scope={\stepcounter{legendid}},
            every node/.style={
                    node distance=0em,
                    align=left,
                    font=\scriptsize,
                    below=of current bounding box.south west,
                    anchor=north west,
                    inner sep = 0em,
                    text depth = 0.25em,
                    text height = 0.75em,
                    execute at begin node={\hspace*{1em}},
                }
        }
}

